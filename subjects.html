<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<canvas id="chart"></canvas>

<script>
fetch("output_data/subjectdata.json")
  .then(r => r.json())
  .then(places => new Chart(chart, {
    type: "bar",
    data: {
      labels: Object.keys(places),
      datasets: [{
        label: "Number of mentions",
        data: Object.values(places)
      }]
    },
    options: {
      layout: {
        padding: 75
      },
      plugins: {
        legend: {
          display: false
        },
        title: {
          display: true,
          text: "Subjects mentioned in the Cambridge Black Oral History Portal",
          color: "#333333",
          font: {
            size: 18
          },
          padding: {
            bottom: 10
          }
        },
        subtitle: {
          display: true,
          text: 'For subjects mentioned five or more times',
          padding: {
            bottom: 20
          }
        }
      },
      scales: {
        x: {
          ticks: {
            minRotation: 45,
            maxRotation: 45
          }
        },
        y: {
        beginAtZero: true,
        suggestedMax: Math.max(...Object.values(places)) * 1.1
        }
      }
    }
  }));
</script>

</body>
</html>
